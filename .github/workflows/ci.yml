name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - name: Swift version
        run: swift --version
      - name: Tests
        run: swift test

  vrt-focused-repeat-pass:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - name: Focused VRT repeat-pass
        run: UI_SNAPSHOT=1 swift test --filter FocusedEditorSnapshotTests

  fcis-audit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FCIS structure check
        run: bash Scripts/fcis-check
